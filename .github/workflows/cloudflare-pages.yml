name: Deploy BlueTalk Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build BlueTalk
        run: python3 build.py

      - name: Ensure BlueTalk KV namespace exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/7ece58c3241a1b80e660bff102f3352a/storage/kv/namespaces"
          namespace_id="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${api}" | jq -r '.result[] | select(.title == "bluetalk-kv") | .id' | head -n 1)"
          if [ -z "${namespace_id}" ]; then
            namespace_id="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"title":"bluetalk-kv"}' \
              "${api}" | jq -r '.result.id')"
          fi
          test -n "${namespace_id}"
          sed -i "s/00000000000000000000000000000000/${namespace_id}/" wrangler.toml
          echo "BlueTalk KV namespace is ready: ${namespace_id}"

      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"name":"bluetalk","production_branch":"main"}' \
            "https://api.cloudflare.com/client/v4/accounts/7ece58c3241a1b80e660bff102f3352a/pages/projects"

      - name: Deploy to Cloudflare Pages (bluetalk.pages.dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: pages deploy dist
