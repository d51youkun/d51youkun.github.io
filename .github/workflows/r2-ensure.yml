name: R2 ensure (bluetalk-media)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r2-ensure.yml'
  workflow_dispatch:

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - name: Probe R2 availability and ensure bucket
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${A:-}" ]; then A=7ece58c3241a1b80e660bff102f3352a; fi
          echo "== account: $A"
          echo "== token verify =="
          curl -s -o /tmp/v.json -w 'HTTP %{http_code}\n' -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/user/tokens/verify"
          head -c 300 /tmp/v.json; echo
          echo "== list R2 buckets =="
          code=$(curl -s -o /tmp/list.json -w '%{http_code}' -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/r2/buckets")
          echo "HTTP $code"; head -c 800 /tmp/list.json; echo
          echo "== create bucket bluetalk-media =="
          code2=$(curl -s -o /tmp/create.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data '{"name":"bluetalk-media"}' "https://api.cloudflare.com/client/v4/accounts/$A/r2/buckets")
          echo "HTTP $code2"; head -c 800 /tmp/create.json; echo
          echo "== list again =="
          curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/r2/buckets" | head -c 800; echo
